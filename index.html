<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panduan dari arul.cg</title>
<style>
  :root { --ink: #0f172a; --muted: #475569; --line: #e2e8f0; --blue: #2563eb; --bg: #f8fafc; }
  @media (prefers-color-scheme: dark) { :root { --ink: #e2e8f0; --muted: #94a3b8; --line: #1e293b; --blue: #60a5fa; --bg: #0b1220; } }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; line-height: 1.6; padding: 32px max(16px, env(safe-area-inset-left)); }
  main { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
  h1 { margin: 0; font-size: 28px; }
  p { margin: 0; color: var(--muted); }
  ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  li { border-bottom: 1px solid var(--line); }
  a.item { display: flex; justify-content: space-between; gap: 12px; padding: 14px 0; color: var(--ink); text-decoration: none; font-weight: 600; }
  a.item span { color: var(--blue); }
  footer a { color: var(--blue); }
</style>
</head>
<body>
<main>
  <h1>Panduan dari arul.cg</h1>
  <p>Kumpulan panduan PDF gratis dari konten Instagram, TikTok, dan YouTube arul.cg.</p>
  <ul>
    <li><a class="item" href="hyperframes.pdf">HyperFrames: bikin video cuma ngetik <span>PDF →</span></a></li>
    <li><a class="item" href="voicestudio.pdf">VoiceStudio: klon suara &amp; dubbing AI gratis <span>PDF →</span></a></li>
  </ul>
  <footer><p>Butuh aplikasi untuk kebutuhan sehari-hari? Cek <a href="https://lynk.id/arullagi">lynk.id/arullagi</a></p></footer>
</main>
</body>
</html>
